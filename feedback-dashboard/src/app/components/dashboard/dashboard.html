<div class="dashboard">

  <!-- Header -->
  <header class="dash-header">
    <div>
      <h1>Customer Feedback Dashboard</h1>
      <p>Real-time aggregation &amp; trend analysis</p>
    </div>
  </header>

  <!-- Filters -->
  <section class="section">
    <app-filter-panel
      [initialFilter]="filter"
      (filterChange)="onFilterChange($event)">
    </app-filter-panel>
  </section>

  <!-- KPI Cards -->
  <section class="section">
    <app-kpi-cards [summary]="summary"></app-kpi-cards>
  </section>

  <!-- Charts row -->
  <section class="section charts-row">
    <div class="chart-wide">
      <app-trend-chart
        [trendData]="trendData"
        [(groupBy)]="trendGroupBy">
      </app-trend-chart>
    </div>
    <div class="chart-narrow">
      <app-sentiment-chart [summary]="summary"></app-sentiment-chart>
    </div>
    <div class="chart-narrow">
      <app-category-chart [summary]="summary"></app-category-chart>
    </div>
  </section>

  <!-- Feedback list -->
  <section class="section">
    <app-feedback-list
      [result]="listResult"
      [loading]="listLoading"
      (pageChange)="onPageChange($event)"
      (resolveToggle)="onResolveToggle($event)">
    </app-feedback-list>
  </section>

</div>
